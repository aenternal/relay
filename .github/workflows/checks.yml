name: Checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - run: go test ./...
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...

  desktop-server-smoke:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spikes/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            go.sum
            spikes/desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: spikes/desktop/package-lock.json
      - run: CGO_ENABLED=0 go test -tags server ./...
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  desktop-native-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cmd/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            go.sum
            cmd/desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - if: runner.os == 'Linux'
        run: go build -trimpath -buildvcs=false -tags production,gtk3 -o relay .
      - if: runner.os == 'macOS'
        run: go build -trimpath -buildvcs=false -tags production -o relay .
      - if: runner.os == 'Windows'
        run: go build -trimpath -buildvcs=false -tags production -o relay.exe .
      - if: runner.os == 'Windows'
        run: ./relay.exe --version
      - if: runner.os != 'Windows'
        run: ./relay --version

  desktop-app-checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            go.sum
            cmd/desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: CGO_ENABLED=0 go test -tags server ./...
        working-directory: cmd/desktop

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            go.sum
            cmd/desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
      - run: govulncheck ./...
      - run: CGO_ENABLED=0 govulncheck -tags server ./...
        working-directory: cmd/desktop
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
